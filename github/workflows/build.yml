name: Migrate BassPlayer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract BassPlayer project
        run: |
          mkdir /tmp/bassplayer
          unzip -q BassPlayer.zip -d /tmp/bassplayer
          cp -a /tmp/bassplayer/BassPlayer/. .
          rm BassPlayer.zip

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: extract BassPlayer Android project"
          git push