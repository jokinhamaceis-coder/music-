name: Migrate BassPlayer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf /tmp/BassPlayer
          mkdir -p /tmp/BassPlayer
          unzip -q BassPlayer.zip -d /tmp/BassPlayer

          echo "=== ZIP CONTENT ==="
          find /tmp/BassPlayer -maxdepth 3 -type f | sort

      - name: Find Android project
        run: |
          PROJECT=$(find /tmp/BassPlayer -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "Projeto encontrado em: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

      - name: Remove ZIP
        run: rm -f BassPlayer.zip

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "chore: extract BassPlayer Android project"
          git push